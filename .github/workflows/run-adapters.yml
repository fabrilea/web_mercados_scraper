name: Actualizar datos (precios y promos bancarias)

on:
  workflow_dispatch:
  schedule:
    # Cada 3 días a las 03:00 UTC. Este repo es público a propósito: GitHub Actions es gratis e
    # ilimitado en repos públicos (a diferencia de los 2000 min/mes de uno privado, que fue lo
    # que bloqueó la cuenta corriendo esto mismo a diario desde el repo principal). Por eso el
    # scraping se separó acá — el repo con el panel admin y la lógica de negocio sigue privado.
    #
    # Pero Actions no es el recurso escaso: lo es el COMPUTE DE LA DB. El 2026-09-23 esto agotó
    # el 100% de las 100 CU-hours mensuales del plan free de Neon, que cobra por tiempo de
    # compute encendido, y el 25 la base se cayó del todo. El scraping quedó congelado hasta el
    # 2026-10-01 (el bloque `schedule` entero comentado — no alcanza con comentar sólo el cron:
    # un `schedule:` sin items es YAML inválido y el workflow deja de cargar).
    #
    # La causa de fondo ya está arreglada en el repo principal, en dos partes:
    #   1. `normalize.ts` resolvía el producto por código de barras con un `findUnique` POR ITEM
    #      (~45.000 consultas por corrida). Ahora indexa por EAN la caché que ya cargaba.
    #   2. `save_adapter_results.ts` insertaba una fila en Precio por producto en cada corrida
    #      aunque el precio fuera idéntico. Ahora inserta sólo los cambios: medido sobre el
    #      histórico, el 89% de las filas eran repeticiones.
    #
    # ⚠️ Si cambiás esta frecuencia, hay que acompañarla en el OTRO repo: `UMBRAL_DIAS_DEFAULT`
    # en src/lib/frescura.ts tiene que quedar en ~1,5x el intervalo (hoy 4 días). Si queda muy
    # bajo, una corrida que falle a medias esconde catálogo bueno; si queda muy alto, los
    # productos descatalogados siguen a la vista durante días.
    #
    # Queda en cada 3 días a propósito, no se volvió a diario todavía: los dos arreglos de arriba
    # están SIN VERIFICAR contra una corrida real. Si esta primera corrida de octubre tarda
    # bastante menos que la hora y media de antes y el log muestra que la mayoría de los items
    # salen como "sin cambios", recién ahí conviene volver a diario — y bajando el umbral de
    # frescura a 1,5 en el mismo movimiento.
    #
    # `*/3` corre los días 1, 4, 7... del mes; al cambiar de mes el salto puede ser de un día
    # en vez de tres, lo cual no molesta para esto.
    - cron: '0 3 */3 * *'

jobs:
  run-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run adapters (precios)
        run: npx ts-node scripts/run_adapters.ts
      - name: Run promos bancarias
        run: npx ts-node scripts/run_promos_bancarias.ts
